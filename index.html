<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrek Zone</title>
<style>
:root{color-scheme:dark;--green:#83c936;--deep:#173d19;--lime:#c4f36a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7ffe9;background:radial-gradient(ellipse at 50% 35%,#5c9b2b 0,#2c6827 38%,#123b1c 100%);display:grid;place-items:center}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:radial-gradient(#eaffbb 1px,transparent 1px);background-size:28px 28px}
main{position:relative;text-align:center;padding:28px 18px;z-index:1}
h1{font-size:clamp(2.7rem,8vw,6.5rem);line-height:.95;margin:0 0 12px;font-weight:1000;letter-spacing:-.07em;text-shadow:0 5px 0 #214c1b,0 12px 30px #071d0b88}
.sub{margin:0 0 8px;color:#e1ffc1;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.82rem}
.hint{margin:8px 0 0;color:#e4ffce;font-weight:650}
.shrek-button{display:block;border:0;background:transparent;padding:0;margin:0 auto;cursor:pointer;filter:drop-shadow(0 22px 18px #071b0b88);transition:transform .22s ease,filter .22s ease;animation:bob 3.2s ease-in-out infinite}
.shrek-button:hover{transform:translateY(-9px) scale(1.045);filter:drop-shadow(0 28px 24px #071b0bcc)}
.shrek-button:active{transform:scale(.97)}
.shrek-button:focus-visible{outline:4px solid #efffb4;outline-offset:8px;border-radius:30px}
.shrek{width:min(68vw,430px);height:auto;display:block}
.pill{display:inline-flex;align-items:center;gap:9px;margin-top:22px;padding:11px 18px;border:1px solid #d7ff9a77;border-radius:999px;background:#153c1a88;box-shadow:inset 0 1px #ffffff22;color:#f2ffdf;font-weight:800;letter-spacing:.04em}
.dot{width:9px;height:9px;border-radius:50%;background:#c4f36a;box-shadow:0 0 12px #c4f36a}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.overlay{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:22px;background:#061307eF;backdrop-filter:blur(10px)}
.overlay.open{display:grid}
.player{width:min(100%,980px);position:relative}
.player video{width:100%;max-height:78vh;background:#000;border:2px solid #a8e85e;border-radius:18px;box-shadow:0 25px 90px #000b}
.close{position:absolute;right:0;top:-54px;border:1px solid #d7ff9a88;background:#204d20;color:white;border-radius:999px;padding:10px 16px;font-size:1rem;font-weight:800;cursor:pointer}
.caption{text-align:center;color:#e4ffc9;margin:12px 0 0;font-weight:700}
@media(max-width:520px){.shrek{width:min(82vw,360px)}.overlay{padding:12px}.close{top:-48px}}
</style>
</head>
<body>
<main>
  <p class="sub">A very important destination</p>
  <h1>SHREK ZONE</h1>
  <button class="shrek-button" id="shrekButton" aria-label="Click Shrek to play the video">
    <svg class="shrek" viewBox="0 0 420 440" role="img" aria-label="A friendly green ogre with trumpet-shaped ears">
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4e85b"/><stop offset=".55" stop-color="#78bd35"/><stop offset="1" stop-color="#4b8c28"/></linearGradient>
        <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9a6336"/><stop offset="1" stop-color="#59371f"/></linearGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <ellipse cx="210" cy="416" rx="130" ry="17" fill="#061d0b" opacity=".35" filter="url(#soft)"/>
      <!-- ears -->
      <path d="M105 144 C55 123 19 95 18 61 C17 42 31 34 48 43 C82 61 112 88 143 111Z" fill="url(#skin)" stroke="#376f24" stroke-width="5"/>
      <path d="M315 144 C365 123 401 95 402 61 C403 42 389 34 372 43 C338 61 308 88 277 111Z" fill="url(#skin)" stroke="#376f24" stroke-width="5"/>
      <path d="M42 59 Q74 78 111 119" fill="none" stroke="#d8f58c" stroke-width="8" stroke-linecap="round" opacity=".6"/>
      <path d="M378 59 Q346 78 309 119" fill="none" stroke="#d8f58c" stroke-width="8" stroke-linecap="round" opacity=".6"/>
      <!-- body -->
      <path d="M92 414 Q92 321 123 278 Q157 248 210 248 Q263 248 297 278 Q328 321 328 414Z" fill="url(#vest)" stroke="#422a19" stroke-width="6"/>
      <path d="M154 267 L210 324 L266 267 Q245 248 210 248 Q175 248 154 267Z" fill="#e4d0a1" stroke="#6d512d" stroke-width="5"/>
      <path d="M188 313 L210 335 L232 313 L246 414 L174 414Z" fill="#e7d7b4" opacity=".9"/>
      <!-- neck -->
      <path d="M169 235 L169 276 Q210 300 251 276 L251 235Z" fill="#76b937" stroke="#4c8127" stroke-width="4"/>
      <!-- head -->
      <path d="M104 139 Q110 69 210 66 Q310 69 316 139 L307 221 Q294 274 210 283 Q126 274 113 221Z" fill="url(#skin)" stroke="#376f24" stroke-width="6"/>
      <path d="M132 113 Q158 79 210 82" fill="none" stroke="#d8f58c" stroke-width="8" stroke-linecap="round" opacity=".45"/>
      <!-- brows -->
      <path d="M137 155 Q166 135 193 154" fill="none" stroke="#477c25" stroke-width="12" stroke-linecap="round"/>
      <path d="M227 154 Q254 135 283 155" fill="none" stroke="#477c25" stroke-width="12" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="166" cy="169" rx="24" ry="18" fill="#fff8dc"/>
      <ellipse cx="254" cy="169" rx="24" ry="18" fill="#fff8dc"/>
      <ellipse cx="170" cy="170" rx="8" ry="12" fill="#4c6426"/>
      <ellipse cx="250" cy="170" rx="8" ry="12" fill="#4c6426"/>
      <circle cx="172" cy="166" r="3" fill="white"/><circle cx="252" cy="166" r="3" fill="white"/>
      <!-- nose -->
      <path d="M194 177 Q184 205 174 214 Q210 235 246 214 Q236 205 226 177Z" fill="#70ad32" stroke="#477c25" stroke-width="4"/>
      <ellipse cx="190" cy="213" rx="6" ry="4" fill="#376b24"/><ellipse cx="230" cy="213" rx="6" ry="4" fill="#376b24"/>
      <!-- smile -->
      <path d="M158 237 Q210 270 262 237 Q246 267 210 268 Q174 267 158 237Z" fill="#5b812c"/>
      <path d="M174 243 Q210 257 246 243" fill="none" stroke="#e5f6b2" stroke-width="4" stroke-linecap="round"/>
      <!-- vest details -->
      <path d="M128 293 L170 414 M292 293 L250 414" stroke="#bd8b51" stroke-width="7"/>
      <circle cx="159" cy="342" r="5" fill="#e2c27b"/><circle cx="261" cy="342" r="5" fill="#e2c27b"/>
    </svg>
  </button>
  <p class="hint">Click the ogre. You know you want to.</p>
  <div class="pill"><span class="dot"></span> TAP SHREK TO UNLOCK THE VIDEO</div>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Shrek video player">
  <div class="player">
    <button class="close" id="closeButton" aria-label="Close video">✕ Close</button>
    <video id="video" controls playsinline preload="metadata">
      <source src="ss.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <p class="caption">Enjoy your highly important Shrek experience.</p>
  </div>
</div>
<script>
const overlay=document.getElementById('overlay');
const video=document.getElementById('video');
function openVideo(){overlay.classList.add('open');video.currentTime=0;video.play().catch(()=>{});}
function closeVideo(){video.pause();overlay.classList.remove('open');}
document.getElementById('shrekButton').addEventListener('click',openVideo);
document.getElementById('closeButton').addEventListener('click',closeVideo);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeVideo();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closeVideo();});
</script>
</body>
</html>
